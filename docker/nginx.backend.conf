events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Dynamic WebSocket upgrade header mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── HTTP Server (Port 80) ──
    server {
        listen 80;
        listen [::]:80;
        server_name chesstogether-abhi.duckdns.org 13.126.89.91 localhost _;

        # ACME challenge for future renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server (Port 443) ──
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name chesstogether-abhi.duckdns.org 13.126.89.91 localhost;

        ssl_certificate /etc/letsencrypt/live/chesstogether-abhi.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chesstogether-abhi.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # 1. Netty Socket.IO WebSocket Route (Port 9092)
        location /api/socket_io/ {
            proxy_pass http://backend:9092/api/socket_io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 2. Spring Boot REST API Route (Port 8080)
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
