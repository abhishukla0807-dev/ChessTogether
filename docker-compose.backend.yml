version: '3.8'

services:
  # ── Java Spring Boot + Netty Socket.IO Backend ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chesstogether-backend
    environment:
      - SERVER_PORT=8080
      - SOCKETIO_PORT=9092
      - SOCKETIO_HOST=0.0.0.0
      - JAVA_OPTS=-XX:+UseSerialGC -Xms128m -Xmx350m
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 450M

  # ── Nginx Unified Reverse Proxy (Port 80 & 443) ──
  nginx:
    image: nginx:alpine
    container_name: chesstogether-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.backend.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
